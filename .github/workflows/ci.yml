name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install published runtime dependencies
        run: composer update --no-dev --no-interaction --prefer-dist --no-progress

      - name: Installed framework contract
        run: php tests/runtime_install.php

      - name: CLI boot
        run: php core list

      - name: PHP syntax check
        run: |
          for dir in app bootstrap config public routes support; do
            if [ -d "$dir" ]; then
              find "$dir" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            fi
          done

      - name: Public disk URL contract
        run: php tests/public_disk.php

      - name: Development router
        run: php tests/dev_server.php
